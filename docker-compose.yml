services:
  app:
    build: .
    container_name: rpqc_app_8122
    ports:
      - "8122:8000"
    environment:
      APP_NAME: ResidentialProperQuoteCraft
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8122
      APP_KEY: "base64:lpYWRw+HPHZxDsLdrdOj7bhEoO94BYFXDfa8ab1P+Ws="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: residentialproperquotecraft
      DB_USERNAME: rpqc
      DB_PASSWORD: secret
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ['--character-set-server=utf8mb4','--collation-server=utf8mb4_unicode_ci']
    container_name: rpqc_mysql_8122
    environment:
      MYSQL_DATABASE: residentialproperquotecraft
      MYSQL_USER: rpqc
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33092:3306"
    volumes:
      - rpqc_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rpqc_redis_8122
    ports:
      - "63812:6379"
    restart: unless-stopped

volumes:
  rpqc_mysql:
